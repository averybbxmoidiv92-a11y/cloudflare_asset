<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WendySG - 个人名片</title>
    <style>
        :root {
            --bg: #f5f7fa;
            --card-bg: #ffffff;
            --primary: #3b6cb4;
            --primary-light: #5b8cd4;
            --primary-dark: #2c5282;
            --primary-soft: #e8f0fb;
            --text: #2d3748;
            --text-secondary: #5a6c7d;
            --text-muted: #8899aa;
            --border: #e5ecf3;
            --shadow-sm: 0 1px 3px rgba(44, 82, 130, 0.06), 0 1px 2px rgba(44, 82, 130, 0.04);
            --shadow-md: 0 8px 30px rgba(44, 82, 130, 0.10), 0 4px 12px rgba(44, 82, 130, 0.06);
            --shadow-lg: 0 20px 50px rgba(44, 82, 130, 0.13), 0 8px 20px rgba(44, 82, 130, 0.07);
            --shadow-btn: 0 2px 8px rgba(44, 82, 130, 0.10), 0 1px 3px rgba(44, 82, 130, 0.06);
            --shadow-btn-hover: 0 6px 20px rgba(44, 82, 130, 0.16), 0 2px 6px rgba(44, 82, 130, 0.10);
            --radius: 20px;
            --radius-sm: 12px;
            --transition: 0.25s cubic-bezier(0.4, 0.0, 0.2, 1);
            --transition-flip: 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            background-image:
                radial-gradient(ellipse at 20% 20%, rgba(59, 108, 180, 0.04) 0%, transparent 55%),
                radial-gradient(ellipse at 75% 70%, rgba(59, 108, 180, 0.05) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 50%, rgba(59, 108, 180, 0.02) 0%, transparent 70%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            position: relative;
            overflow-x: hidden;
        }

        .bg-decoration {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            opacity: 0.35;
        }
        .bg-decoration.line-top {
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent 0%, rgba(59, 108, 180, 0.3) 30%, rgba(59, 108, 180, 0.5) 50%, rgba(59, 108, 180, 0.3) 70%, transparent 100%);
        }
        .bg-decoration.circle-1 {
            top: 10%;
            left: 8%;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 1.5px solid rgba(59, 108, 180, 0.12);
        }
        .bg-decoration.circle-2 {
            bottom: 14%;
            right: 6%;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 1.5px solid rgba(59, 108, 180, 0.10);
        }
        .bg-decoration.dots {
            top: 18%;
            right: 12%;
            width: 50px;
            height: 50px;
            background-image: radial-gradient(circle, rgba(59, 108, 180, 0.2) 1.8px, transparent 1.8px);
            background-size: 12px 12px;
        }

        .card-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            perspective: 1200px;
        }

        .card-flipper {
            position: relative;
            width: 100%;
            transform-style: preserve-3d;
            transition: transform var(--transition-flip);
            will-change: transform;
        }
        .card-flipper.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 44px 36px 36px;
            box-shadow: var(--shadow-lg);
            text-align: center;
            position: relative;
            overflow: hidden;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            width: 100%;
        }

        .card-front {
            cursor: pointer;
        }

        .card-back {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            transform: rotateY(180deg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100%;
            cursor: pointer;
        }

        .card-back-inner {
            width: 100%;
            transform: scale(0.92);
            transition: transform var(--transition-flip);
            transform-origin: center center;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .card-flipper.flipped .card-back-inner {
            transform: scale(1);
        }

        .card-flipper:not(.flipped) .card-back {
            pointer-events: none;
        }

        .card-flipper.flipped .card-front {
            pointer-events: none;
        }

        .card-face::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 4px;
            border-radius: 0 0 6px 6px;
            background: linear-gradient(90deg, var(--primary-light), var(--primary), var(--primary-dark));
            opacity: 0.85;
            z-index: 1;
        }

        .card-face::after {
            content: '';
            position: absolute;
            top: -80px;
            left: 50%;
            transform: translateX(-50%);
            width: 280px;
            height: 160px;
            background: radial-gradient(ellipse, rgba(59, 108, 180, 0.04) 0%, transparent 70%);
            pointer-events: none;
            border-radius: 50%;
            z-index: 0;
        }

        .avatar-container {
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
            z-index: 2;
            width: 90px;
            height: 90px;
        }
        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1px;
            box-shadow: 0 8px 28px rgba(44, 82, 130, 0.25), 0 0 0 6px var(--primary-soft);
            user-select: none;
            transition: var(--transition);
            position: relative;
            object-fit: cover;
            overflow: hidden;
            text-decoration: none;
            cursor: pointer;
        }
        .avatar:hover {
            box-shadow: 0 12px 36px rgba(44, 82, 130, 0.32), 0 0 0 10px var(--primary-soft);
            transform: translateY(-2px);
        }
        .avatar.avatar-image {
            background: transparent;
            font-size: 0;
            color: transparent;
            letter-spacing: 0;
            padding: 0;
        }
        .avatar.avatar-image img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
        }
        .avatar-ring {
            position: absolute;
            top: -16px;
            left: -16px;
            width: calc(100% + 32px);
            height: calc(100% + 32px);
            border-radius: 50%;
            border: 2px dashed rgba(59, 108, 180, 0.18);
            animation: rotate-slow 28s linear infinite;
            pointer-events: none;
        }
        @keyframes rotate-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .birthday-hat-container {
            position: absolute;
            z-index: 3;
            display: none;
            pointer-events: none;
            transform: scale(0);
            opacity: 1;
        }
        .birthday-hat-container img {
            max-width: 100%;
            height: auto;
            display: block;
        }
        
        .birthday-hat-container.growing {
            animation: birthday-hat-grow 1.4s forwards;
        }
        @keyframes birthday-hat-grow {
            0% { transform: scale(0); animation-timing-function: cubic-bezier(0.25, 0.1, 0.25, 1); }
            7.14% { transform: scale(0.12); animation-timing-function: cubic-bezier(0.25, 0.1, 0.25, 1); }
            14.28% { transform: scale(0.25); animation-timing-function: cubic-bezier(0.42, 0, 1, 1); }
            100% { transform: scale(1.2); }
        }

        .confetti-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 4;
            overflow: visible;
        }
        .confetti-piece {
            position: absolute;
            top: 50%;
            left: 50%;
            opacity: 0;
            border-radius: 1px;
            transform: translate(-50%, -50%);
            animation: confetti-burst 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }
        @keyframes confetti-burst {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) rotate(0deg) scale(1);
            }
            70% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty) + 30px)) rotate(var(--rot)) scale(0.3);
            }
        }

        .name {
            font-size: 28px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            z-index: 2;
            position: relative;
        }
        .role-tag {
            display: inline-block;
            font-size: 13px;
            font-weight: 500;
            color: var(--primary);
            background: var(--primary-soft);
            padding: 5px 14px;
            border-radius: 20px;
            letter-spacing: 0.4px;
            margin-bottom: 24px;
            z-index: 2;
            position: relative;
        }
        .divider {
            width: 50px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--border), transparent);
            margin: 0 auto 22px;
            border-radius: 1px;
            position: relative;
            z-index: 2;
        }

        .contact-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 2;
            position: relative;
        }
        .contact-item {
            display: flex;
            align-items: center;
            gap: 14px;
            background: #fafcfd;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 13px 18px;
            cursor: pointer;
            transition: var(--transition);
            user-select: none;
            position: relative;
            text-align: left;
            min-height: 52px;
        }
        .contact-item:hover {
            background: #f6f9fc;
            border-color: #d0dde8;
            box-shadow: var(--shadow-sm);
            transform: translateY(-1px);
        }
        .contact-item:active {
            transform: scale(0.985);
            transition: 0.1s ease;
            background: #eef4f9;
        }
        .contact-item .copy-toast {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 11px;
            font-weight: 600;
            color: #38a169;
            background: #f0fff4;
            padding: 4px 10px;
            border-radius: 14px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
            white-space: nowrap;
            letter-spacing: 0.3px;
        }
        .contact-item .copy-toast.show {
            opacity: 1;
            transform: translateY(-50%) translateX(-4px);
        }
        .contact-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: var(--transition);
        }
        .icon-email {
            background: #eaf2fb;
            color: var(--primary);
        }
        .icon-qq {
            background: #eef5fb;
            color: #3b7dd8;
        }
        .contact-item:hover .contact-icon {
            transform: scale(1.06);
        }
        .contact-icon svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .icon-qq svg {
            fill: currentColor;
            stroke: none;
            stroke-width: 0;
        }
        .contact-info {
            flex: 1;
            min-width: 0;
        }
        .contact-label {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 2px;
        }
        .contact-value {
            font-size: 15px;
            font-weight: 500;
            color: var(--text);
            word-break: break-all;
            transition: var(--transition);
        }
        .contact-item:hover .contact-value {
            color: var(--primary-dark);
        }
        .copy-hint {
            font-size: 10px;
            color: #bcc8d6;
            margin-left: 2px;
            font-weight: 400;
            letter-spacing: 0.3px;
            transition: var(--transition);
        }
        .contact-item:hover .copy-hint {
            color: #99aabb;
        }

        .back-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2;
            position: relative;
            width: 100%;
            padding: 10px 0;
        }
        .back-logo-container {
            display: inline-block;
            margin-bottom: 18px;
            transition: all 0.4s ease;
            text-decoration: none;
            cursor: pointer;
            line-height: 0;
        }
        .back-logo-container.hidden {
            display: none;
        }
        .back-logo-container:hover .back-logo {
            transform: scale(1.04);
        }
        .back-logo {
            width: 160px;
            height: auto;
            display: block;
            object-fit: contain;
            transition: var(--transition);
        }
        .back-school-name {
            font-size: 19px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            line-height: 1.3;
            text-align: center;
        }
        .back-info-divider {
            width: 36px;
            height: 2px;
            background: var(--border);
            border-radius: 1px;
            margin: 4px auto 14px;
        }

        .back-info-list {
            width: 100%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .info-row {
            display: flex;
            align-items: flex-start;
            font-size: 14px;
            line-height: 1.7;
            color: var(--text-secondary);
        }
        .info-label {
            width: 5em;
            flex-shrink: 0;
            font-weight: 600;
            color: var(--primary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-align: justify;
            text-align-last: justify;
            letter-spacing: 0.5px;
        }
        .info-colon {
            flex-shrink: 0;
            margin-right: 0.4em;
            color: var(--text-muted);
            font-weight: 500;
        }
        .info-value {
            flex: 1;
            min-width: 0;
            text-align: justify;
            text-align-last: left;
            word-break: break-all;
            color: var(--text-secondary);
        }

        .back-content.no-logo .back-school-name {
            margin-top: 8px;
        }
        .back-content.no-logo .back-info-divider {
            margin-top: 8px;
        }

        .flip-btn-wrapper {
            display: flex;
            justify-content: center;
            margin-top: 18px;
            position: relative;
            z-index: 3;
        }
        .flip-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #ffffff;
            border: 1.5px solid #e5ecf3;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-btn);
            transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
            color: var(--primary);
            outline: none;
            -webkit-tap-highlight-color: transparent;
            position: relative;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        .flip-btn:hover {
            box-shadow: var(--shadow-btn-hover);
            transform: translateY(-2px) scale(1.04);
            border-color: #d0dde8;
            color: var(--primary-dark);
        }
        .flip-btn:active,
        .flip-btn.is-pressing {
            transform: scale(0.94);
            transition: 0.12s ease;
            box-shadow: var(--shadow-sm);
            background: #f6f9fc;
        }
        .flip-btn svg {
            width: 20px;
            height: 20px;
            pointer-events: none;
            transition: transform 0.35s cubic-bezier(0.4, 0.0, 0.2, 1);
        }
        .card-flipper.flipped~.flip-btn-wrapper .flip-btn svg {
            transform: rotate(180deg);
        }

        .flip-btn-tooltip {
            position: absolute;
            bottom: -22px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            color: var(--text-muted);
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            letter-spacing: 0.4px;
        }
        .flip-btn:hover .flip-btn-tooltip {
            opacity: 1;
        }

        .footer-note {
            text-align: center;
            margin-top: 16px;
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            z-index: 1;
            position: relative;
        }
        .footer-note span {
            color: var(--primary);
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .card-face {
                padding: 36px 20px 28px;
                border-radius: 16px;
            }
            .avatar-container {
                width: 74px;
                height: 74px;
            }
            .avatar {
                width: 74px;
                height: 74px;
                font-size: 30px;
                box-shadow: 0 8px 24px rgba(44, 82, 130, 0.25), 0 0 0 5px var(--primary-soft);
            }
            .avatar:hover {
                box-shadow: 0 12px 32px rgba(44, 82, 130, 0.32), 0 0 0 8px var(--primary-soft);
            }
            .avatar-ring {
                top: -12px;
                left: -12px;
                width: calc(100% + 24px);
                height: calc(100% + 24px);
            }
            .name {
                font-size: 24px;
            }
            .contact-item {
                padding: 11px 14px;
                gap: 10px;
            }
            .contact-icon {
                width: 34px;
                height: 34px;
                border-radius: 8px;
            }
            .contact-icon svg {
                width: 17px;
                height: 17px;
            }
            .contact-value {
                font-size: 13px;
            }
            .contact-item .copy-toast {
                font-size: 10px;
                right: 10px;
                padding: 3px 8px;
            }
            .back-logo {
                width: 130px;
            }
            .back-school-name {
                font-size: 16px;
            }
            .back-info-list {
                max-width: 280px;
                gap: 8px;
            }
            .info-row {
                font-size: 13px;
                line-height: 1.6;
            }
            .back-logo-container {
                margin-bottom: 12px;
            }
            .flip-btn {
                width: 40px;
                height: 40px;
            }
            .flip-btn svg {
                width: 18px;
                height: 18px;
            }
            .flip-btn-wrapper {
                margin-top: 14px;
            }
            .bg-decoration.circle-1 {
                width: 70px;
                height: 70px;
                top: 6%;
                left: 3%;
            }
            .bg-decoration.circle-2 {
                width: 50px;
                height: 50px;
                bottom: 8%;
                right: 3%;
            }
            .bg-decoration.dots {
                top: 10%;
                right: 6%;
                width: 36px;
                height: 36px;
                background-size: 9px 9px;
            }
        }

        @media (max-width: 360px) {
            .card-face {
                padding: 28px 14px 22px;
            }
            .contact-value {
                font-size: 12px;
            }
            .contact-label {
                font-size: 10px;
            }
            .name {
                font-size: 22px;
            }
            .avatar-container {
                width: 64px;
                height: 64px;
            }
            .avatar {
                width: 64px;
                height: 64px;
                font-size: 26px;
            }
            .avatar-ring {
                top: -10px;
                left: -10px;
                width: calc(100% + 20px);
                height: calc(100% + 20px);
            }
            .back-logo {
                width: 105px;
            }
            .back-school-name {
                font-size: 15px;
            }
            .back-info-list {
                max-width: 240px;
                gap: 6px;
            }
            .info-row {
                font-size: 12px;
                line-height: 1.55;
            }
            .flip-btn {
                width: 36px;
                height: 36px;
            }
            .flip-btn svg {
                width: 16px;
                height: 16px;
            }
        }
    </style>
</head>

                                <path d="M12 2C9.5 2 7 3.5 6.5 6C5.5 7 4.5 8.5 4.5 11C4.5 14 6 16 7.5 17C7.5 17.5 7 18.5 6.5 20C6 21 6.5 22 8 22C9 22 10 21 10.5 20C11 19.5 11.5 18.5 12 18C12.5 18.5 13 19.5 13.5 20C14 21 15 22 16 22C17.5 22 18 21 17.5 20C17 18.5 16.5 17.5 16.5 17C18 16 19.5 14 19.5 11C19.5 8.5 18.5 7 17.5 6C17 3.5 14.5 2 12 2Z" />
                                <circle cx="9.5" cy="10" r="1.2" fill="white" />
                                <circle cx="14.5" cy="10" r="1.2" fill="white" />
                            </svg>
                        </div>
                        <div class="contact-info">
                            <div class="contact-label">QQ</div>
                            <div class="contact-value">3631928084 <span class="copy-hint">点击复制</span></div>
                        </div>
                        <span class="copy-toast">已复制</span>
                    </li>
                </ul>
            </div>

            <div class="card-face card-back" id="cardBack">
                <div class="card-back-inner">
                    <div class="back-content" id="backContent">
                        <a class="back-logo-container" id="backLogoContainer" href="https://www.fjny.edu.cn/index.htm" target="_blank" rel="noopener noreferrer" title="点击访问学校官网">
                            <img class="back-logo" id="backLogo" src="https://althgot.de5.net/static/school_logo.png" alt="福建农业职业技术学院校徽">
                        </a>
                        <h2 class="back-school-name">福建农业职业技术学院</h2>
                        <div class="back-info-divider"></div>
                        <div class="back-info-list">
                            <div class="info-row">
                                <span class="info-label">所在校区</span>
                                <span class="info-colon">：</span>
                                <span class="info-value">相思岭校区</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">校区地址</span>
                                <span class="info-colon">：</span>
                                <span class="info-value">福州市福清市镜洋镇红星村龟山116号</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">就读专业</span>
                                <span class="info-colon">：</span>
                                <span class="info-value">工程造价</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">所在学院</span>
                                <span class="info-colon">：</span>
                                <span class="info-value">园林园艺学院</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">入学年份</span>
                                <span class="info-colon">：</span>
                                <span class="info-value">2026年</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="flip-btn-wrapper">
            <button class="flip-btn" id="flipBtn" title="翻转名片" aria-label="翻转名片">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" stroke-dasharray="42 14" stroke-linecap="round" />
                    <polyline points="7,8 5,11 8,11" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                    <polyline points="17,16 19,13 16,13" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span class="flip-btn-tooltip">翻转</span>
            </button>
        </div>

        <p class="footer-note">Designed by <span>WendySG</span></p>
    </div>

    <script>
        (function() {
            const BIRTHDAY_DATE = "07-22";

            // ========== 头像加载逻辑 ==========
            const avatarEl = document.getElementById('avatar');
            const avatarImageUrl = 'https://althgot.de5.net/static/avatar.jpg';

            function setDefaultAvatar() {
                avatarEl.classList.remove('avatar-image');
                avatarEl.innerHTML = '';
                avatarEl.textContent = 'W';
                avatarEl.style.background = 'linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%)';
                avatarEl.style.color = '#ffffff';
                avatarEl.style.fontSize = '';
                avatarEl.style.fontWeight = '';
                avatarEl.style.letterSpacing = '';
                avatarEl.title = '点击添加QQ';
            }

            function setImageAvatar(imgSrc) {
                avatarEl.classList.add('avatar-image');
                avatarEl.textContent = '';
                avatarEl.style.background = 'transparent';
                avatarEl.style.color = 'transparent';
                avatarEl.style.fontSize = '0';
                avatarEl.style.letterSpacing = '0';
                const img = document.createElement('img');
                img.src = imgSrc;
                img.alt = 'WendySG 头像';
                img.onload = function() {
                    avatarEl.classList.add('avatar-image');
                };
                img.onerror = function() {
                    setDefaultAvatar();
                };
                avatarEl.innerHTML = '';
                avatarEl.appendChild(img);
                avatarEl.title = '点击添加QQ';
            }

            function checkAvatar() {
                const testImg = new Image();
                const timeout = setTimeout(() => {
                    testImg.src = '';
                    setDefaultAvatar();
                }, 5000);
                testImg.onload = function() {
                    clearTimeout(timeout);
                    setImageAvatar(avatarImageUrl);
                };
                testImg.onerror = function() {
                    clearTimeout(timeout);
                    setDefaultAvatar();
                };
                testImg.src = avatarImageUrl;
            }

            checkAvatar();

            // ========== 背面校徽加载逻辑 ==========
            const backLogoContainer = document.getElementById('backLogoContainer');
            const backLogo = document.getElementById('backLogo');
            const backContent = document.getElementById('backContent');
            const schoolLogoUrl = 'https://althgot.de5.net/static/school_logo.png';

            function hideLogoContainer() {
                if (backLogoContainer) {
                    backLogoContainer.classList.add('hidden');
                }
                if (backContent) {
                    backContent.classList.add('no-logo');
                }
            }

            function showLogoContainer() {
                if (backLogoContainer) {
                    backLogoContainer.classList.remove('hidden');
                }
                if (backContent) {
                    backContent.classList.remove('no-logo');
                }
            }

            function checkSchoolLogo() {
                const testImg = new Image();
                const timeout = setTimeout(() => {
                    testImg.src = '';
                    hideLogoContainer();
                }, 5000);
                testImg.onload = function() {
                    clearTimeout(timeout);
                    showLogoContainer();
                    if (backLogo && backLogo.src !== schoolLogoUrl) {
                        backLogo.src = schoolLogoUrl;
                    }
                };
                testImg.onerror = function() {
                    clearTimeout(timeout);
                    hideLogoContainer();
                };
                testImg.src = schoolLogoUrl;
            }

            if (backLogo) {
                backLogo.onerror = function() {
                    hideLogoContainer();
                };
                backLogo.onload = function() {
                    showLogoContainer();
                };
            }

            checkSchoolLogo();

            const flipBtn = document.getElementById('flipBtn');
            const cardFlipper = document.getElementById('cardFlipper');
            const cardFront = document.getElementById('cardFront');
            const cardBack = document.getElementById('cardBack');

            // 长按旋转配置常量
            const LONG_PRESS_THRESHOLD = 200;  // 长按判定阈值
            const ROTATION_SPEED = 900;        // 角速度
            const SNAP_DURATION = 300;         // 吸附动画时长

            // 旋转状态变量
            let isPressing = false;       // 按钮是否被按下
            let isRotating = false;       // 是否处于持续旋转模式
            let isSnapping = false;       // 是否处于吸附动画中
            let wasLongPress = false;     // 本次按下是否触发了长按
            let longPressTimer = null;    // 长按判定计时器
            let rotationAngle = 0;        // 当前旋转角度（累计值）
            let rotationDirection = 1;    // 旋转方向：1=顺时针，-1=逆时针
            let animationFrame = null;    // requestAnimationFrame 句柄
            let lastFrameTime = 0;        // 上一帧时间戳

            // 原有单次翻转功能
            function toggleFlip() {
                cardFlipper.classList.toggle('flipped');
            }

            function startRotation() {
                isRotating = true;

                // 方向判定：背面→逆时针(-1)，正面→顺时针(+1)
                // 仅在长按启动瞬间根据当前卡片状态确定一次
                rotationDirection = cardFlipper.classList.contains('flipped') ? -1 : 1;

                // 设置初始角度（基于当前卡片面）
                rotationAngle = cardFlipper.classList.contains('flipped') ? 180 : 0;

                // 移除 flipped 类，通过内联 transform 接管旋转控制
                cardFlipper.classList.remove('flipped');

                // 禁用 CSS 过渡，实现匀速自由旋转
                cardFlipper.style.transition = 'none';
                cardFlipper.style.transform = 'rotateY(' + rotationAngle + 'deg)';

                lastFrameTime = performance.now();
                animationFrame = requestAnimationFrame(rotateStep);
            }

            // ========== 旋转动画帧回调 ==========
            function rotateStep(now) {
                if (!isRotating) return;

                const dt = (now - lastFrameTime) / 1000; // 经过的秒数
                lastFrameTime = now;

                // 按恒定角速度累加角度
                rotationAngle += rotationDirection * ROTATION_SPEED * dt;

                cardFlipper.style.transform = 'rotateY(' + rotationAngle + 'deg)';

                animationFrame = requestAnimationFrame(rotateStep);
            }

            // ========== 吸附至最近的完整面 ==========
            function snapToFace() {
                isRotating = false;
                isSnapping = true;

                if (animationFrame) {
                    cancelAnimationFrame(animationFrame);
                    animationFrame = null;
                }

                // 找到最近的 180° 倍数
                let nearest180 = Math.round(rotationAngle / 180) * 180;
                let diff = rotationAngle - nearest180;

                // 等距情况（当前角度恰好距两个完整面各 90°）：统一吸附至正面（0° 的倍数）
                if (Math.abs(Math.abs(diff) - 90) < 0.5) {
                    nearest180 = Math.round(rotationAngle / 360) * 360;
                }

                // 若已处于目标角度，不播放过渡动画，直接保持静止
                if (Math.abs(nearest180 - rotationAngle) < 0.5) {
                    syncFlippedClass(nearest180);
                    cardFlipper.style.transition = '';
                    cardFlipper.style.transform = '';
                    isSnapping = false;
                    return;
                }

                // 启用 0.3s ease-out 缓出过渡
                cardFlipper.style.transition = 'transform 0.3s ease-out';
                // 强制重排，确保过渡从当前角度生效
                void cardFlipper.offsetWidth;
                cardFlipper.style.transform = 'rotateY(' + nearest180 + 'deg)';

                // 过渡结束后同步 flipped 类状态
                setTimeout(function() {
                    syncFlippedClass(nearest180);
                    // 清除内联样式，交由 CSS 类接管
                    cardFlipper.style.transition = '';
                    cardFlipper.style.transform = '';
                    isSnapping = false;
                }, SNAP_DURATION);
            }

            // 根据最终角度同步 flipped 类状态
            function syncFlippedClass(angle) {
                var finalMod = ((angle % 360) + 360) % 360;
                if (Math.abs(finalMod - 180) < 0.5) {
                    cardFlipper.classList.add('flipped');
                } else {
                    cardFlipper.classList.remove('flipped');
                }
            }

            // ========== 按下处理 ==========
            function startPress() {
                // 旋转中或吸附中或已按下时，忽略新的按下事件
                if (isPressing || isRotating || isSnapping) return;

                isPressing = true;
                wasLongPress = false;
                flipBtn.classList.add('is-pressing');

                // 200ms 后触发长按旋转
                longPressTimer = setTimeout(function() {
                    wasLongPress = true;
                    startRotation();
                }, LONG_PRESS_THRESHOLD);
            }

            // ========== 松开处理 ==========
            function endPress() {
                if (!isPressing) return null;

                isPressing = false;
                flipBtn.classList.remove('is-pressing');

                if (longPressTimer) {
                    clearTimeout(longPressTimer);
                    longPressTimer = null;
                }

                var wasRotating = isRotating;

                if (isRotating) {
                    snapToFace();
                }

                return { wasRotating: wasRotating, wasLongPress: wasLongPress };
            }

            // ========== 绑定翻转按钮事件 ==========
            if (flipBtn) {
                // 鼠标按下
                flipBtn.addEventListener('mousedown', function(e) {
                    if (e.button !== 0) return; // 仅响应左键
                    startPress();
                });

                // 触摸开始
                flipBtn.addEventListener('touchstart', function(e) {
                    e.preventDefault(); // 阻止鼠标事件模拟和默认滚动
                    startPress();
                }, { passive: false });

                // 触摸结束
                flipBtn.addEventListener('touchend', function(e) {
                    e.preventDefault();
                    var result = endPress();
                    // 短按（未旋转且未长按）时执行翻转
                    if (result && !result.wasRotating && !result.wasLongPress) {
                        toggleFlip();
                    }
                    // 重置标志，防止后续可能的鼠标 click 误判
                    wasLongPress = false;
                }, { passive: false });

                // 触摸取消（如手指移出触摸区域）
                flipBtn.addEventListener('touchcancel', function() {
                    endPress();
                });

                // 鼠标点击（短按翻转，长按不翻转）
                flipBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    if (wasLongPress || isRotating || isSnapping) {
                        wasLongPress = false;
                        return;
                    }
                    toggleFlip();
                });
            }

            // 鼠标松开监听在 document 上，处理鼠标移出按钮后释放的情况
            document.addEventListener('mouseup', function() {
                endPress();
            });

            // 页面失去焦点时视为松手，执行吸附
            window.addEventListener('blur', function() {
                endPress();
            });

            // ========== 卡片正面/背面点击翻转（旋转期间不响应） ==========
            if (cardFront && cardFlipper) {
                cardFront.addEventListener('click', function(e) {
                    // 按钮按住期间不响应卡片翻转
                    if (isPressing || isRotating || isSnapping) return;
                    if (e.target.closest('.contact-item') || e.target.closest('.avatar')) {
                        return;
                    }
                    toggleFlip();
                });
            }

            if (cardBack && cardFlipper) {
                cardBack.addEventListener('click', function(e) {
                    if (isPressing || isRotating || isSnapping) return;
                    if (e.target.closest('.back-logo-container')) {
                        return;
                    }
                    toggleFlip();
                });
            }

            // 头像点击 - 阻止冒泡，保留默认跳转行为
            if (avatarEl) {
                avatarEl.addEventListener('click', function(e) {
                    e.stopPropagation();
                });
            }

            // 校徽点击 - 阻止冒泡，保留默认跳转行为
            if (backLogoContainer) {
                backLogoContainer.addEventListener('click', function(e) {
                    e.stopPropagation();
                });
            }

            // ========== 复制功能（与翻转互斥） ==========
            const contactItems = document.querySelectorAll('.contact-item');

            contactItems.forEach(item => {
                item.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const textToCopy = this.getAttribute('data-copy');
                    const toast = this.querySelector('.copy-toast');

                    if (!textToCopy) return;

                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(textToCopy).then(() => {
                            showToast(toast);
                        }).catch(() => {
                            fallbackCopy(textToCopy, toast);
                        });
                    } else {
                        fallbackCopy(textToCopy, toast);
                    }
                });
            });

            function fallbackCopy(text, toast) {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.left = '-9999px';
                textarea.style.top = '-9999px';
                textarea.style.opacity = '0';
                textarea.style.pointerEvents = 'none';
                document.body.appendChild(textarea);
                textarea.focus();
                textarea.select();
                try {
                    document.execCommand('copy');
                    showToast(toast);
                } catch (err) {
                    console.warn('复制失败:', err);
                }
                document.body.removeChild(textarea);
            }

            function showToast(toast) {
                if (!toast) return;
                toast.classList.remove('show');
                void toast.offsetWidth;
                toast.classList.add('show');
                clearTimeout(toast._timeout);
                toast._timeout = setTimeout(() => {
                    toast.classList.remove('show');
                }, 1800);
            }

            // ========== 生日帽逻辑与彩带特效 ==========
            function shouldShowHat() {
                if (BIRTHDAY_DATE === "always") return true;
                const today = new Date();
                const month = String(today.getMonth() + 1).padStart(2, '0');
                const day = String(today.getDate()).padStart(2, '0');
                return `${month}-${day}` === BIRTHDAY_DATE;
            }

            let hatAnimationStarted = false;

            function updateBirthdayHatStyle() {
                if (!shouldShowHat()) return;
                const hatContainer = document.getElementById('birthdayHatContainer');
                if (!hatContainer || !avatarEl) return;

                const avatarWidth = avatarEl.offsetWidth;
                if (avatarWidth === 0) {
                    requestAnimationFrame(updateBirthdayHatStyle);
                    return;
                }

                const baseSize = 90;
                const scaleRatio = avatarWidth / baseSize;
                
                hatContainer.style.top = `${-35 * scaleRatio}px`;
                hatContainer.style.left = `${22 * scaleRatio}px`;
                hatContainer.style.width = `${avatarWidth * 0.7}px`;
            }

            function createConfetti() {
                const hatContainer = document.getElementById('birthdayHatContainer');
                if (!hatContainer) return;

                const confettiWrapper = document.createElement('div');
                confettiWrapper.className = 'confetti-container';
                hatContainer.appendChild(confettiWrapper);

                const colors = ['#ff6b6b', '#feca57', '#48dbfb', '#1dd1a1', '#5f27cd', '#ee5253', '#54a0ff'];
                const piecesCount = 25;

                for (let i = 0; i < piecesCount; i++) {
                    const piece = document.createElement('div');
                    piece.className = 'confetti-piece';
                    
                    piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    piece.style.width = (4 + Math.random() * 4) + 'px';
                    piece.style.height = (8 + Math.random() * 6) + 'px';
                    
                    const angle = Math.random() * Math.PI * 2;
                    const velocity = 25 + Math.random() * 35; 
                    const tx = Math.cos(angle) * velocity;
                    const ty = Math.sin(angle) * velocity - 30;
                    
                    const rot = (Math.random() - 0.5) * 1080 + 'deg'; 
                    
                    piece.style.setProperty('--tx', tx + 'px');
                    piece.style.setProperty('--ty', ty + 'px');
                    piece.style.setProperty('--rot', rot);
                    
                    confettiWrapper.appendChild(piece);
                }

                setTimeout(() => {
                    if (confettiWrapper.parentNode) {
                        confettiWrapper.parentNode.removeChild(confettiWrapper);
                    }
                }, 500);
            }

            function initBirthdayHat() {
                if (!shouldShowHat()) return;
                const hatContainer = document.getElementById('birthdayHatContainer');
                if (!hatContainer) return;

                updateBirthdayHatStyle();

                if (!hatAnimationStarted) {
                    hatAnimationStarted = true;
                    hatContainer.style.display = 'block';
                    void hatContainer.offsetWidth; 
                    hatContainer.classList.add('growing');

                    setTimeout(() => {
                        const computedTransform = window.getComputedStyle(hatContainer).transform;
                        
                        hatContainer.classList.remove('growing');
                        
                        hatContainer.style.transition = 'none';
                        hatContainer.style.transform = computedTransform === 'none' ? 'scale(1.2)' : computedTransform;
                        
                        void hatContainer.offsetWidth;
                        
                        hatContainer.style.transition = 'transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)';
                        hatContainer.style.transform = 'scale(1)';

                        const onEnd = (e) => {
                            if (e.propertyName === 'transform') {
                                hatContainer.removeEventListener('transitionend', onEnd);
                                createConfetti();
                            }
                        };
                        hatContainer.addEventListener('transitionend', onEnd);
                    }, 1400);
                }
            }

            window.addEventListener('resize', function() {
                if (shouldShowHat()) {
                    updateBirthdayHatStyle();
                }
            });

            initBirthdayHat();
        })();
    </script>
