        .card-back {

            top: auto;
            left: auto;
            right: auto;
            min-height: 0;
        }
    </style>
</head>

                "今天是小雪，小雪西北风，当夜要打霜",
                "今天是大雪，今年麦盖三层被，来年枕着馒头睡",
                "今天是冬至，吃饺子才不会冻耳朵呀"

            // ========== 农历传统节日 ==========
            const rawLunarFestivals = [
                { lunarMonth: 1, lunarDay: 1, text: "今天是春节，爆竹声中一岁除，新年快乐！" },
                { lunarMonth: 1, lunarDay: 15, text: "今天是元宵节，吃汤圆、赏花灯多是一件美事" },
                { lunarMonth: 5, lunarDay: 5, text: "今天是端午节，屈原我跟你没完，你等着我～" },
                { lunarMonth: 7, lunarDay: 7, text: "今天是七夕，这才是真正的“情人节”" },
                { lunarMonth: 7, lunarDay: 15, text: "今天是中元节，晚上早点回家，别在外面瞎溜达" },
                { lunarMonth: 8, lunarDay: 15, text: "今天是中秋节，中秋3天假，2天周末" },
                { lunarMonth: 9, lunarDay: 9, text: "今天是重阳节，登高望远，忆山东兄弟" },
                { lunarMonth: 12, lunarDay: 8, text: "今天是腊八节，小孩小孩你别馋，过了腊八就是年" },
                { lunarMonth: 12, lunarDay: 24, text: "今天是南方的小年，有钱没钱，剃头过年" },
                { lunarMonth: 12, lunarDay: 29, text: "今天是除夕，旧岁至此除，新年万事如意！" }
            ];
        
            // ========== 日期项生成与合并 ==========
            // 统一结构: { month, day, isLunar, text }
            // isLunar=true 表示节日（公历固定节日或农历节日），优先级高于节气
            let allDateItems = [];
        
            function buildAllDateItems(year) {
                const rawItems = [];
        
                // 1. 静态公历节日 -> 节日项（isLunar=true）
                for (const entry of dateMessageMap) {
                    const parts = entry.date.split('-');
                    const m = parseInt(parts[0], 10);
                    const d = parseInt(parts[1], 10);
                    rawItems.push({ month: m, day: d, isLunar: true, text: entry.text });
                }
        
                // 2. 使用 lunar-javascript 获取该年所有节气
                try {
                    // 取年中某一天（夏至通常在6月21日）获取该年的节气表
                    const solar = Solar.fromYmd(year, 6, 21);
                    const lunar = solar.getLunar();
                    const jieQiTable = lunar.getJieQiTable(); // 返回 {节气名: Solar对象}
        
                    for (let i = 0; i < termNames.length; i++) {
                        const name = termNames[i];
                        const termSolar = jieQiTable[name];
                        if (termSolar) {
                            // getMonth() 返回 1-12，getDay() 返回 1-31
                            rawItems.push({
                                month: termSolar.getMonth(),
                                day: termSolar.getDay(),
                                isLunar: false,
                                text: termTexts[i]
                            });
                        }
                    }
                } catch (e) {
                    console.warn('获取节气失败，将跳过节气展示', e);
                }
        
                // 3. 农历传统节日 -> 节日项（isLunar=true）
                for (const f of rawLunarFestivals) {
                    try {
                        // 需要同时检查当前 year 和 year - 1 的农历
                        // 因为公历年初的农历节日（如腊八、除夕）实际上属于上一农历年
                        const yearsToCheck = [year, year - 1];
                        for (const y of yearsToCheck) {
                            const lunarDate = Lunar.fromYmd(y, f.lunarMonth, f.lunarDay);
                            const solarDate = lunarDate.getSolar();
                            
                            // 只有当转换后的公历年份等于当前处理的年份 year 时，才加入列表
                            if (solarDate.getYear() === year) {
                                rawItems.push({
                                    month: solarDate.getMonth(),
                                    day: solarDate.getDay(),
                                    isLunar: true,
                                    text: f.text
                                });
                            }
                        }
                    } catch (e) {
                        console.warn('农历节日转换失败: ', f, e);
                    }
                }
                // 4. 合并：相同 (month, day) 的项合并文案
                // 节日优先；若同时存在节气，则 "节日文案；节气文案"
                const mergedMap = {};
                const orderKeys = [];
        
                for (const item of rawItems) {
                    const key = item.month + '-' + item.day;
                    if (!mergedMap[key]) {
                        mergedMap[key] = {
                            month: item.month,
                            day: item.day,
                            festivalText: item.isLunar ? item.text : '',
                            termText: !item.isLunar ? item.text : '',
                            hasFestival: item.isLunar,
                            hasTerm: !item.isLunar
                        };
                        orderKeys.push(key);
                    } else {
                        const ex = mergedMap[key];
                        if (item.isLunar) {
                            if (!ex.hasFestival) {
                                ex.hasFestival = true;
                                ex.festivalText = item.text;
                            }
                        } else {
                            if (!ex.hasTerm) {
                                ex.hasTerm = true;
                                ex.termText = item.text;
                            }
                        }
                    }
                }
        
                allDateItems = orderKeys.map(key => {
                    const m = mergedMap[key];
                    let finalText = '';
                    if (m.hasFestival) finalText = m.festivalText;
                    if (m.hasTerm) {
                        finalText = finalText ? finalText : m.termText;
                    }
                    return {
                        month: m.month,
                        day: m.day,
                        isLunar: m.hasFestival,
                        text: finalText
                    };
                });
            }
        
            // 初始化当年日期项
            buildAllDateItems(new Date().getFullYear());
        
            // ========== 日期气泡相关常量 ==========
            const BUBBLE_BG_URL = 'https://althgot.de5.net/static/message_bubble.png';
            const BUBBLE_WIDTH = 150;
            const BUBBLE_HEIGHT = 135;
            const BASE_FONT_SIZE = 11;
            const BASE_CHARS_PER_LINE = 12;
            const LINE_HEIGHT_RATIO = 1.7;
            const MIN_FONT_SIZE = 10;
            const BUBBLE_PADDING_H = 16;
            const BUBBLE_PADDING_V = 18;
        
            function getBubbleDimensions() {
                const bubble = document.getElementById('dateBubble');
                if (bubble && bubble.offsetWidth > 0) {
                    return { width: bubble.offsetWidth, height: bubble.offsetHeight };
                }
                if (window.innerWidth <= 360) return { width: 115, height: 115 };
                if (window.innerWidth <= 480) return { width: 130, height: 130 };
                return { width: BUBBLE_WIDTH, height: BUBBLE_HEIGHT };
            }
        
            function getCharWeight(ch) {
                const code = ch.codePointAt(0);
                if (code === undefined) return 0.5;
                if ((code >= 0x4E00 && code <= 0x9FFF) ||
                    (code >= 0x3000 && code <= 0x303F) ||
                    (code >= 0xFF00 && code <= 0xFFEF) ||
                    (code >= 0x3040 && code <= 0x30FF) ||
                    (code >= 0xAC00 && code <= 0xD7AF) ||
                    (code >= 0x2000 && code <= 0x206F) ||
                    code > 0xFFFF) {
                    return 1;
                }
                return 0.5;
            }
        
            function countWeightedChars(text) {
                let total = 0;
                for (const ch of text) total += getCharWeight(ch);
                return total;
            }
        
            function getAvailableWidth(bubbleWidth) {
                return Math.max(bubbleWidth - BUBBLE_PADDING_H * 2, 60);
            }
            function getAvailableHeight(bubbleHeight) {
                return Math.max(bubbleHeight - BUBBLE_PADDING_V * 2, 60);
            }
        
            function calculateFontSizeAndText(text, bubbleWidth, bubbleHeight) {
                const availWidth = getAvailableWidth(bubbleWidth);
                const availHeight = getAvailableHeight(bubbleHeight);
                const totalWeightedChars = countWeightedChars(text);
        
                let fontSize = BASE_FONT_SIZE;
                while (fontSize >= MIN_FONT_SIZE) {
                    const charsPerLine = BASE_CHARS_PER_LINE * (BASE_FONT_SIZE / fontSize) * (availWidth / (BUBBLE_WIDTH - BUBBLE_PADDING_H * 2));
                    const lines = Math.max(1, Math.ceil(totalWeightedChars / charsPerLine));
                    const lineHeight = fontSize * LINE_HEIGHT_RATIO;
                    const totalHeight = lines * lineHeight;
                    if (lines <= 2 || totalHeight <= availHeight) {
                        return { text: text, fontSize: fontSize, needsTruncation: false };
                    }
                    fontSize -= 1;
                }
        
                const charsPerLineMin = BASE_CHARS_PER_LINE * (BASE_FONT_SIZE / MIN_FONT_SIZE) * (availWidth / (BUBBLE_WIDTH - BUBBLE_PADDING_H * 2));
                const maxLinesMin = Math.floor(availHeight / (MIN_FONT_SIZE * LINE_HEIGHT_RATIO));
                const maxWeightedChars = Math.floor(charsPerLineMin * maxLinesMin) - 1.5;
        
                if (maxWeightedChars <= 0) return { text: '…', fontSize: MIN_FONT_SIZE, needsTruncation: true };
        
                let accumulated = 0;
                let cutIndex = 0;
                for (let i = 0; i < text.length; i++) {
                    const w = getCharWeight(text[i]);
                    if (accumulated + w > maxWeightedChars) { cutIndex = i; break; }
                    accumulated += w;
                    cutIndex = i + 1;
                }
                if (cutIndex === 0) cutIndex = 1;
                const truncatedText = text.substring(0, cutIndex) + '…';
                return { text: truncatedText, fontSize: MIN_FONT_SIZE, needsTruncation: true };
            }
        
            function getDateMessage() {
                const today = new Date();
                const month = today.getMonth() + 1;
                const day = today.getDate();
                const mNum = month;
                const dNum = day;
        
                // 在合并后的 allDateItems 中查找
                for (let i = 0; i < allDateItems.length; i++) {
                    if (allDateItems[i].month === mNum && allDateItems[i].day === dNum) {
                        return allDateItems[i].text;
                    }
                }
                // 默认文案
                const monthStr = String(month).padStart(2, '0');
                const dayStr = String(day).padStart(2, '0');
                return '今天是 ' + monthStr + '-' + dayStr + '，今天也要开开心心的过呀';
            }
        
            function updateBubbleDisplay() {
                const bubble = document.getElementById('dateBubble');
                const bubbleText = document.getElementById('dateBubbleText');
                if (!bubble || !bubbleText) return;
                if (!bubble.classList.contains('bubble-visible')) return;
        
                const message = getDateMessage();
                const dims = getBubbleDimensions();
                const result = calculateFontSizeAndText(message, dims.width, dims.height);
        
                bubbleText.textContent = result.text;
                bubbleText.style.fontSize = result.fontSize + 'px';
                bubbleText.style.lineHeight = LINE_HEIGHT_RATIO;
            }
        
            function initDateBubble() {
                const bubble = document.getElementById('dateBubble');
                const bubbleText = document.getElementById('dateBubbleText');
                if (!bubble || !bubbleText) return;
        
                const testImg = new Image();
                const timeout = setTimeout(function() {
                    testImg.src = '';
                    bubble.style.display = 'none';
                    bubble.classList.remove('bubble-visible', 'bubble-animate');
                }, 5000);
        
                testImg.onload = function() {
                    clearTimeout(timeout);
                    const message = getDateMessage();
                    const dims = getBubbleDimensions();
                    const result = calculateFontSizeAndText(message, dims.width, dims.height);
        
                    bubbleText.textContent = result.text;
                    bubbleText.style.fontSize = result.fontSize + 'px';
                    bubbleText.style.lineHeight = LINE_HEIGHT_RATIO;
        
                    bubble.style.display = 'block';
                    bubble.classList.add('bubble-visible');
                    void bubble.offsetWidth;
                    bubble.classList.add('bubble-animate');
        
                    bubble.addEventListener('animationend', function handler(e) {
                        if (e.animationName === 'bubble-pop') {
                            bubble.classList.remove('bubble-animate');
                            bubble.removeEventListener('animationend', handler);
                        }
                    });
                };
        
                testImg.onerror = function() {
                    clearTimeout(timeout);
                    bubble.style.display = 'none';
                    bubble.classList.remove('bubble-visible', 'bubble-animate');
                    bubbleText.textContent = '';
                };
        
                testImg.src = BUBBLE_BG_URL;
            }
        
            // ========== 每日零点文案更新调度 ==========
            let midnightTimer = null;
            function scheduleMidnightUpdate() {
                if (midnightTimer) { clearTimeout(midnightTimer); midnightTimer = null; }
                const now = new Date();
                const midnight = new Date(now);
                midnight.setHours(24, 0, 0, 0);
                const msUntilMidnight = midnight - now;
                const delay = Math.max(msUntilMidnight + 100, 1000);
                midnightTimer = setTimeout(function() {
                    updateBubbleDisplay();
                    scheduleMidnightUpdate();
                }, delay);
            }
        
            // ========== 每年1月1日 00:00 重新生成日期项 ==========
            let yearlyTimer = null;
            function scheduleYearlyRebuild() {
                if (yearlyTimer) { clearTimeout(yearlyTimer); yearlyTimer = null; }
                const now = new Date();
                const nextYear = new Date(now.getFullYear() + 1, 0, 1, 0, 0, 5);
                const msUntilNextYear = nextYear - now;
                yearlyTimer = setTimeout(function() {
                    buildAllDateItems(new Date().getFullYear());
                    updateBubbleDisplay();
                    scheduleYearlyRebuild();
                }, msUntilNextYear);
            }
        
            // ========== 响应式处理 ==========
            let resizeDebounceTimer = null;
            function handleResize() {
                if (resizeDebounceTimer) clearTimeout(resizeDebounceTimer);
                resizeDebounceTimer = setTimeout(function() {
                    updateBubbleDisplay();
                }, 250);
            }
            window.addEventListener('resize', handleResize);
        
            // ========== 初始化 ==========
            initDateBubble();
            scheduleMidnightUpdate();
            scheduleYearlyRebuild();
        
            // ========== 头像加载逻辑 ==========
            const avatarEl = document.getElementById('avatar');
            const avatarImageUrl = 'https://althgot.de5.net/static/avatar.jpg';
        
            function setDefaultAvatar() {
                avatarEl.classList.remove('avatar-image');

                avatarEl.textContent = 'W';
                avatarEl.style.background = 'linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%)';

                avatarEl.style.fontSize = '';
                avatarEl.style.fontWeight = '';
                avatarEl.style.letterSpacing = '';
                avatarEl.title = '点击添加QQ';
            }
        
            function setImageAvatar(imgSrc) {
                avatarEl.classList.add('avatar-image');
                avatarEl.textContent = '';
                avatarEl.style.background = 'transparent';
                avatarEl.style.color = 'transparent';
                avatarEl.style.fontSize = '0';
                avatarEl.style.letterSpacing = '0';

                img.src = imgSrc;
                img.alt = 'WendySG 头像';
                img.onload = function() { avatarEl.classList.add('avatar-image'); };
                img.onerror = function() { setDefaultAvatar(); };

                avatarEl.appendChild(img);
                avatarEl.title = '点击添加QQ';

            function checkAvatar() {
                const testImg = new Image();
                const timeout = setTimeout(() => { testImg.src = ''; setDefaultAvatar(); }, 5000);
                testImg.onload = function() { clearTimeout(timeout); setImageAvatar(avatarImageUrl); };
                testImg.onerror = function() { clearTimeout(timeout); setDefaultAvatar(); };
                testImg.src = avatarImageUrl;
            }
            checkAvatar();
        
            // ========== 背面校徽加载逻辑 ==========
            const backLogoContainer = document.getElementById('backLogoContainer');
            const backLogo = document.getElementById('backLogo');
            const backContent = document.getElementById('backContent');
            const schoolLogoUrl = 'https://althgot.de5.net/static/school_logo.png';
        
            function hideLogoContainer() {
                if (backLogoContainer) backLogoContainer.classList.add('hidden');
                if (backContent) backContent.classList.add('no-logo');
            }
            function showLogoContainer() {
                if (backLogoContainer) backLogoContainer.classList.remove('hidden');
                if (backContent) backContent.classList.remove('no-logo');
            }
        
            function checkSchoolLogo() {
                const testImg = new Image();
                const timeout = setTimeout(() => { testImg.src = ''; hideLogoContainer(); }, 5000);
                testImg.onload = function() {
                    clearTimeout(timeout);
                    showLogoContainer();
                    if (backLogo && backLogo.src !== schoolLogoUrl) backLogo.src = schoolLogoUrl;
                };
                testImg.onerror = function() { clearTimeout(timeout); hideLogoContainer(); };
                testImg.src = schoolLogoUrl;
            }
            if (backLogo) {
                backLogo.onerror = function() { hideLogoContainer(); };
                backLogo.onload = function() { showLogoContainer(); };
            }
            checkSchoolLogo();
            const flipBtn = document.getElementById('flipBtn');
            const cardFlipper = document.getElementById('cardFlipper');
            const cardFront = document.getElementById('cardFront');
            const cardBack = document.getElementById('cardBack');
        
            const LONG_PRESS_THRESHOLD = 200;
            const ROTATION_SPEED = 900;
            const SNAP_DURATION = 300;
        
            let isPressing = false;
            let isRotating = false;
            let isSnapping = false;
            let wasLongPress = false;
            let longPressTimer = null;
            let rotationAngle = 0;
            let rotationDirection = 1;
            let animationFrame = null;
            let lastFrameTime = 0;
        
            function toggleFlip() { cardFlipper.classList.toggle('flipped'); }
        
            function startRotation() {
                isRotating = true;
                rotationDirection = cardFlipper.classList.contains('flipped') ? -1 : 1;
                rotationAngle = cardFlipper.classList.contains('flipped') ? 180 : 0;
                cardFlipper.classList.remove('flipped');
                cardFlipper.style.transition = 'none';
                cardFlipper.style.transform = 'rotateY(' + rotationAngle + 'deg)';
                lastFrameTime = performance.now();
                animationFrame = requestAnimationFrame(rotateStep);
            }
        
            function rotateStep(now) {
                if (!isRotating) return;
                const dt = (now - lastFrameTime) / 1000;
                lastFrameTime = now;
                rotationAngle += rotationDirection * ROTATION_SPEED * dt;
                cardFlipper.style.transform = 'rotateY(' + rotationAngle + 'deg)';
                animationFrame = requestAnimationFrame(rotateStep);
            }
        
            function snapToFace() {
                isRotating = false;
                isSnapping = true;
                if (animationFrame) { cancelAnimationFrame(animationFrame); animationFrame = null; }
                let nearest180 = Math.round(rotationAngle / 180) * 180;
                let diff = rotationAngle - nearest180;
                if (Math.abs(Math.abs(diff) - 90) < 0.5) {
                    nearest180 = Math.round(rotationAngle / 360) * 360;
                }
                if (Math.abs(nearest180 - rotationAngle) < 0.5) {
                    syncFlippedClass(nearest180);
                    cardFlipper.style.transition = '';
                    cardFlipper.style.transform = '';
                    isSnapping = false;
                    return;
                }
                cardFlipper.style.transition = 'transform 0.3s ease-out';
                void cardFlipper.offsetWidth;
                cardFlipper.style.transform = 'rotateY(' + nearest180 + 'deg)';
                setTimeout(function() {
                    syncFlippedClass(nearest180);
                    cardFlipper.style.transition = '';
                    cardFlipper.style.transform = '';
                    isSnapping = false;
                }, SNAP_DURATION);
            }
        
            function syncFlippedClass(angle) {
                var finalMod = ((angle % 360) + 360) % 360;
                if (Math.abs(finalMod - 180) < 0.5) cardFlipper.classList.add('flipped');
                else cardFlipper.classList.remove('flipped');
            }
        
            function startPress() {
                if (isPressing || isRotating || isSnapping) return;
                isPressing = true;
                wasLongPress = false;
                flipBtn.classList.add('is-pressing');
                longPressTimer = setTimeout(function() {
                    wasLongPress = true;
                    startRotation();
                }, LONG_PRESS_THRESHOLD);
            }
        
            function endPress() {
                if (!isPressing) return null;
                isPressing = false;
                flipBtn.classList.remove('is-pressing');
                if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
                var wasRotating = isRotating;
                if (isRotating) snapToFace();
                return { wasRotating: wasRotating, wasLongPress: wasLongPress };
            }
        
            if (flipBtn) {
                flipBtn.addEventListener('mousedown', function(e) {
                    if (e.button !== 0) return;
                    startPress();
                });
                flipBtn.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                    startPress();
                }, { passive: false });
                flipBtn.addEventListener('touchend', function(e) {
                    e.preventDefault();
                    var result = endPress();
                    if (result && !result.wasRotating && !result.wasLongPress) toggleFlip();
                    wasLongPress = false;
                }, { passive: false });
                flipBtn.addEventListener('touchcancel', function() { endPress(); });
                flipBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    if (wasLongPress || isRotating || isSnapping) { wasLongPress = false; return; }
                    toggleFlip();
                });
            }
        
            document.addEventListener('mouseup', function() { endPress(); });
            window.addEventListener('blur', function() { endPress(); });
        
            if (cardFront && cardFlipper) {
                cardFront.addEventListener('click', function(e) {
                    if (isPressing || isRotating || isSnapping) return;
                    if (e.target.closest('.contact-item') || e.target.closest('.avatar') || e.target.closest('.date-bubble')) return;
                    toggleFlip();
                });
            }
            if (cardBack && cardFlipper) {
                cardBack.addEventListener('click', function(e) {
                    if (isPressing || isRotating || isSnapping) return;
                    if (e.target.closest('.back-logo-container')) return;
                    toggleFlip();
                });
            }
            if (avatarEl) avatarEl.addEventListener('click', function(e) { e.stopPropagation(); });
            if (backLogoContainer) backLogoContainer.addEventListener('click', function(e) { e.stopPropagation(); });
        
            // ========== 复制功能 ==========
            const contactItems = document.querySelectorAll('.contact-item');
            contactItems.forEach(item => {
                item.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const textToCopy = this.getAttribute('data-copy');
                    const toast = this.querySelector('.copy-toast');
                    if (!textToCopy) return;
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(textToCopy).then(() => showToast(toast)).catch(() => fallbackCopy(textToCopy, toast));
                    } else {
                        fallbackCopy(textToCopy, toast);
                    }
                });
            });
        
            function fallbackCopy(text, toast) {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.left = '-9999px';
                textarea.style.top = '-9999px';
                textarea.style.opacity = '0';
                textarea.style.pointerEvents = 'none';
                document.body.appendChild(textarea);
                textarea.focus();
                textarea.select();
                try { document.execCommand('copy'); showToast(toast); } catch (err) { console.warn('复制失败:', err); }
                document.body.removeChild(textarea);
            }
        
            function showToast(toast) {
                if (!toast) return;
                toast.classList.remove('show');
                void toast.offsetWidth;
                toast.classList.add('show');
                clearTimeout(toast._timeout);
                toast._timeout = setTimeout(() => { toast.classList.remove('show'); }, 1800);
            }
        
            // ========== 生日帽逻辑与彩带特效 ==========
            function shouldShowHat() {
                if (BIRTHDAY_DATE === "always") return true;
                const today = new Date();
                const month = String(today.getMonth() + 1).padStart(2, '0');
                const day = String(today.getDate()).padStart(2, '0');
                return `${month}-${day}` === BIRTHDAY_DATE;
            }
        
            let hatAnimationStarted = false;
        
            function updateBirthdayHatStyle() {
                if (!shouldShowHat()) return;
                const hatContainer = document.getElementById('birthdayHatContainer');
                if (!hatContainer || !avatarEl) return;
                const avatarWidth = avatarEl.offsetWidth;
                if (avatarWidth === 0) { requestAnimationFrame(updateBirthdayHatStyle); return; }
                const baseSize = 90;
                const scaleRatio = avatarWidth / baseSize;
                hatContainer.style.top = `${-35 * scaleRatio}px`;
                hatContainer.style.left = `${22 * scaleRatio}px`;
                hatContainer.style.width = `${avatarWidth * 0.7}px`;
            }
        
            function createConfetti() {
                const hatContainer = document.getElementById('birthdayHatContainer');
                if (!hatContainer) return;
                const confettiWrapper = document.createElement('div');
                confettiWrapper.className = 'confetti-container';
                hatContainer.appendChild(confettiWrapper);
                const colors = ['#ff6b6b', '#feca57', '#48dbfb', '#1dd1a1', '#5f27cd', '#ee5253', '#54a0ff'];
                const piecesCount = 25;
                for (let i = 0; i < piecesCount; i++) {
                    const piece = document.createElement('div');
                    piece.className = 'confetti-piece';
                    piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    piece.style.width = (4 + Math.random() * 4) + 'px';
                    piece.style.height = (8 + Math.random() * 6) + 'px';
                    const angle = Math.random() * Math.PI * 2;
                    const velocity = 25 + Math.random() * 35;
                    const tx = Math.cos(angle) * velocity;
                    const ty = Math.sin(angle) * velocity - 30;
                    const rot = (Math.random() - 0.5) * 1080 + 'deg';
                    piece.style.setProperty('--tx', tx + 'px');
                    piece.style.setProperty('--ty', ty + 'px');
                    piece.style.setProperty('--rot', rot);
                    confettiWrapper.appendChild(piece);
                }
                setTimeout(() => { if (confettiWrapper.parentNode) confettiWrapper.parentNode.removeChild(confettiWrapper); }, 500);
            }
        
            function initBirthdayHat() {
                if (!shouldShowHat()) return;
                const hatContainer = document.getElementById('birthdayHatContainer');
                if (!hatContainer) return;
                updateBirthdayHatStyle();
                if (!hatAnimationStarted) {
                    hatAnimationStarted = true;
                    hatContainer.style.display = 'block';
                    void hatContainer.offsetWidth;
                    hatContainer.classList.add('growing');
                    setTimeout(() => {
                        const computedTransform = window.getComputedStyle(hatContainer).transform;
                        hatContainer.classList.remove('growing');
                        hatContainer.style.transition = 'none';
                        hatContainer.style.transform = computedTransform === 'none' ? 'scale(1.2)' : computedTransform;
                        void hatContainer.offsetWidth;
                        hatContainer.style.transition = 'transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)';
                        hatContainer.style.transform = 'scale(1)';
                        const onEnd = (e) => {
                            if (e.propertyName === 'transform') {
                                hatContainer.removeEventListener('transitionend', onEnd);
                                createConfetti();
                            }
                        };
                        hatContainer.addEventListener('transitionend', onEnd);
                    }, 1400);
                }
            }
        
            window.addEventListener('resize', function() {
                if (shouldShowHat()) updateBirthdayHatStyle();
            });
        
            initBirthdayHat();
        })();
    </script>
</body>

</html>
